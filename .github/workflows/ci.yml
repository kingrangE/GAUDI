name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # During bootstrap, backend/ may land in a later PR; skip cleanly until it exists.
      - id: check
        run: |
          if [ -f backend/pyproject.toml ]; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.check.outputs.run == 'true'
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        if: steps.check.outputs.run == 'true'
        working-directory: backend
        run: ruff check .
      - name: Test
        if: steps.check.outputs.run == 'true'
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # During bootstrap, frontend/ may land in a later PR; skip cleanly until it exists.
      - id: check
        run: |
          if [ -f frontend/package.json ]; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.run == 'true'
        with:
          node-version: "20"
      - name: Install
        if: steps.check.outputs.run == 'true'
        working-directory: frontend
        run: npm install
      - name: Lint
        if: steps.check.outputs.run == 'true'
        working-directory: frontend
        run: npm run lint
      - name: Type-check
        if: steps.check.outputs.run == 'true'
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        if: steps.check.outputs.run == 'true'
        working-directory: frontend
        run: npm test
