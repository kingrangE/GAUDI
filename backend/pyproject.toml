[project]
name = "and-you-backend"
version = "0.0.0"
description = "and-you — AI Agent evaluation platform backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite",
    "asyncpg",
    "pydantic-settings",
    "openai>=1.40",
    "redis",
    "rq",
    "tiktoken",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Both foundations live under backend/: the shared app (`app/`) and minsu's
# dev-prompting (`feature_dev_prompting/`, `llm/`, top-level modules). pythonpath
# makes both importable during test collection regardless of install layout.
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: exercises a real external service (LLM); skipped without credentials",
    "harness: offline judge-reliability harness tests",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Top-level single-file modules: demo solver (dev-prompting) + RQ grading worker.
py-modules = ["demo_solutions", "worker"]

[tool.setuptools.packages.find]
# Ship the shared app package and minsu's top-level feature packages + llm seam.
include = [
    "app*",
    "feature_dev_prompting*",
    "feature_spec_design*",
    "feature_context_engineering*",
    "llm*",
]
