# Local infrastructure for development. Start with: docker compose up -d
# Provides Redis for the RQ grading worker (see backend/worker.py).
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data

volumes:
  redis-data:
